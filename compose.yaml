services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pke-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pke
      POSTGRES_USER: pke
      POSTGRES_PASSWORD: pke_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pke -d pke"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
